<div class="card my-5">
  <div *ngIf="tableVisible">
    <p-table
      #dt
      [value]="plans"
      [globalFilterFields]="['planName', 'price', 'timeperiod']"
      selectionMode="single"
      editMode="row"
      dataKey="id"
      [tableStyle]="{ 'min-width': '50rem' }"
      [rows]="10"
      [paginator]="true"
      [(selection)]="selectedplans"
      [scrollable]="true"
      scrollHeight="700px"
      [first]="first"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
      (onPage)="pageChange($event)"
      [rowsPerPageOptions]="[5, 10, 20]"
      sortMode="multiple"
    >
      <ng-template #caption>
        <div class="d-flex justify-content-between align-items-center">
          <p-iconfield iconPosition="right">
            <p-button
              (click)="router.navigate(['/secure/module/add'])"
              label="Add New Plans"
              icon="pi pi-plus"
              class="mr-2"
            />
          </p-iconfield>
          <p-iconfield iconPosition="left" class="ml-auto">
            <p-inputicon>
              <i class="pi pi-search"></i>
            </p-inputicon>
            <input
              pInputText
              type="text"
              (input)="dt.filterGlobal(getValues($event), 'contains')"
              placeholder="Search keyword"
            />
          </p-iconfield>
        </div>
      </ng-template>

      <ng-template #header class="text-center">
        <tr class="text-center">
          <th
            pSortableColumn="planName"
            style="min-width: 200px"
            class="text-center"
          >
            <p-columnFilter
              type="text"
              field="planName"
              display="menu"
              class="ml-auto"
            />
            Plan Name <p-sortIcon field="planName" />
          </th>
          <th
            pSortableColumn="price"
            style="min-width: 200px"
            class="text-center"
          >
            <p-columnFilter
              type="text"
              field="price"
              display="menu"
              class="ml-auto"
            />
            Price<p-sortIcon field="price" />
          </th>
          <th
            pSortableColumn="description"
            style="min-width: 400px"
            class="text-center"
          >
            Description <p-sortIcon field="description" />
          </th>

          <th
            pSortableColumn="timePeriod"
            style="min-width: 200px"
            class="text-center"
          >
            <p-columnFilter
              type="text"
              field="timePeriod"
              display="menu"
              class="ml-auto"
            ></p-columnFilter>
            Time Period <p-sortIcon field="timePeriod"></p-sortIcon>
          </th>
          <th
            pSortableColumn="activate"
            style="min-width: 100px"
            class="text-center"
          >
            <p-columnFilter
              type="text"
              field="activate"
              display="menu"
              class="ml-auto"
            />
            Activate<p-sortIcon field="activate" />
          </th>
          <th style="min-width: 200px" class="text-center">Action</th>
        </tr>
      </ng-template>

      <ng-template #body let-plans class="text-center">
        <tr [pSelectableRow]="plans" class="text-center">
          <td class="text-center">
            <div class="flex items-center gap-2">
              <span class="ml-1 align-middle">
                {{ plans.planName | uppercase }}
              </span>
            </div>
          </td>
          <td class="text-center">
            <div class="flex items-center gap-2">
              <span class="ml-1 align-middle">{{
                plans.price | currency
              }}</span>
            </div>
          </td>
          <td class="text-center">
            <div class="flex items-center gap-2">
              <span class="ml-1 align-middle">{{ plans.description }}</span>
            </div>
          </td>
          <td class="text-center">
            <div class="flex items-center gap-2">
              <span class="ml-1 align-middle">{{
                plans.timePeriod | timeperiod
              }}</span>
            </div>
          </td>
          <td class="text-center">
            <div class="flex items-center gap-2">
              <p-toast />
              <p-confirmpopup key="confirm1" />
              <p-button
                (onClick)="confirmPlanAction($event, plans, 'confirm1')"
                label="{{ plans.activate ? 'Activate' : 'Deactivate' }}"
                [severity]="plans.activate ? 'success' : 'danger'"
                [outlined]="true"
              >
              </p-button>
            </div>
          </td>

          <td>
            <div class="d-flex justify-content-around align-items-center">
              <div class="flex items-center gap-2">
                <p-button
                  icon="pi pi-pencil"
                  class="mr-2"
                  [rounded]="true"
                  [outlined]="true"
                  (click)="router.navigate(['/secure/module/edit', plans.id])"
                />
              </div>
              <div class="flex items-center gap-2">
                <p-button
                  icon="pi pi-trash"
                  severity="danger"
                  [rounded]="true"
                  [outlined]="true"
                  (click)="confirmDelete(plans, 'confirmDelete')"
                />
              </div>
              <div class="flex items-center gap-2">
                <p-button
                  icon="pi pi-eye"
                  severity="info"
                  [rounded]="true"
                  [outlined]="true"
                  (click)="viewPlanDetail(plans.id)"
                />
              </div>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
  <p-confirmDialog key="confirmDelete" [style]="{ width: '450px' }" />

  <p-dialog
    [(visible)]="planDetailDialog"
    id="detailsDialog"
    [style]="{ width: '500px' }"
    header="Trainers Details"
    [modal]="true"
    [dismissableMask]="true"
  >
    <div class="container p-3">
      <div class="row">
        <div class="col-md-12">
          <div
            *ngFor="let field of planDetailsFields"
            class="p-2 border-bottom d-flex justify-content-between"
          >
            <strong class="text-primary">{{ field.label | uppercase }}:</strong>
            <span class="text-dark">{{ field.value }}</span>
          </div>
        </div>
      </div>
    </div>

    <ng-template #footer>
      <p-button
        label="Close"
        icon="pi pi-times"
        text
        (click)="planDetailDialog = false"
      />
    </ng-template>
  </p-dialog>
</div>
